<title>Blød Stang Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;1,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: full-bleed 3D stage, floating glass control panel (right on desktop, bottom sheet on phone) */
:root{
  --stage:#8d8d8a;
  --panel:rgba(20,20,22,.86); --fg:#f3f0e9; --muted:#a8a49b; --gold:#e3b95f; --gold-ink:#1a1712; --line:rgba(255,255,255,.12);
  --display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--display);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(130% 100% at 50% 40%, transparent 55%, rgba(0,0,0,.28))}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#softLabel{font:italic 800 clamp(28px,5vw,44px)/1 var(--display);color:#fff;letter-spacing:.01em;text-shadow:0 2px 14px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.6)}
#goalPill{font:600 13px var(--display);background:rgba(20,20,22,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:flex;gap:10px;align-items:center}
#goalPill .val{font-size:13px}
.pop{position:fixed;pointer-events:none;font:italic 800 26px var(--display);color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.6);transform:translate(-50%,-50%);animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#banner{position:fixed;left:50%;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,-50%);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--gold);border-radius:16px;padding:20px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:min(320px, calc(100% - 32px));box-sizing:border-box}
#banner h2{margin:0;font:italic 800 30px var(--display);color:var(--gold)}
#banner p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px, env(safe-area-inset-right,0px));width:300px;
  max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;touch-action:pan-y}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.big{font-weight:600;font-size:15px}
.val{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--gold);font-size:13px}
input[type=range]{width:100%;accent-color:var(--gold);margin:4px 0 0}
.chips{display:flex;gap:6px}
.chip,.btn{font:600 13px var(--display);color:var(--fg);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;padding:7px 0;cursor:pointer;flex:1}
.chip.on,.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns .btn{padding:9px 10px}
.level{display:flex;gap:6px;align-items:center}
.level .btn{flex:0 0 36px;padding:8px 0}
.level select{flex:1;font-weight:700;font-size:14px}
#goalText{font-size:12.5px;color:var(--muted);line-height:1.4;margin:0}
.group{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.group h3{margin:0;font:600 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ctl label{font-size:13px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.toggle input{accent-color:var(--gold);width:16px;height:16px}
select{width:100%;font:13px var(--display);background:rgba(255,255,255,.07);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px}
select option{background:#222;color:var(--fg)}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
#moreBtn{display:none}
@media (max-width:640px){
  .panel{top:auto;width:auto;left:max(12px, env(safe-area-inset-left,0px));right:max(12px, env(safe-area-inset-right,0px));
    bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-height:60%;padding:12px 14px;gap:10px}
  #moreBtn{display:block}
  .panel:not(.open) .more{display:none}
  #goalText{display:none}
  #banner{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 110px)}
  #softLabel{font-size:26px}
}
@media (prefers-reduced-motion: reduce){ .pop{animation-duration:.01s} }
</style>

<div id="stage"></div>
<div id="vignette"></div>

</div>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const V = THREE.Vector3;
const DT = 1 / 240, ITERS = 12, TUBE_R = 0.42;
const IS_PHONE = Math.min(innerWidth, innerHeight) < 500;

// ---------- parameters ----------
const P = {
  soft: 0.5, length: 2.2, radius: 0.2, speed: 3.5, gravity: 9.8, friction: 0.5, slowmo: 1,
  maxPieces: 8, holeX: 0.3, holeZ: 1.2, holeR: 0.5, glass: 0.55, auto: true, cutter: true, sound: true, metal: 'gold'
};
const METALS = {
  gold:   { label: 'Guld',     color: 0xf5c66a, metalness: 1, roughness: 0.12 },
  silver: { label: 'Sølv',     color: 0xeeeef2, metalness: 1, roughness: 0.1 },
  copper: { label: 'Kobber',   color: 0xec8f5f, metalness: 1, roughness: 0.16 },
  rose:   { label: 'Rosaguld', color: 0xf3b5a3, metalness: 1, roughness: 0.13 },
  chrome: { label: 'Krom',     color: 0xffffff, metalness: 1, roughness: 0.03 },
  slime:  { label: 'Slim',     color: 0x5fdc6f, metalness: 0, roughness: 0.06 },
  candy:  { label: 'Slik',     color: 0xff5fa2, metalness: 0.05, roughness: 0.2 }
};

// ---------- levels ----------
// B = horizontal direction across the rod's flight path in the classic layout
const CLASSIC_PATH = [[-1.7, 8.8, -0.9], [-1.7, 6.6, -0.9], [-1.66, 5.5, -0.75], [-1.4, 4.95, -0.25], [-0.85, 4.75, 0.4]];
const HELIX = (() => {
  const pts = [], cx = -0.8, cz = -0.3, R = 1.1, turns = 1.25, end = -Math.PI / 4, a0 = end - turns * Math.PI * 2;
  for (let i = 0; i <= 40; i++) { const t = i / 40, a = a0 + (end - a0) * t; pts.push([cx + R * Math.cos(a), 9.2 - t * 4, cz + R * Math.sin(a)]); }
  return pts;
})();
const BX = -0.616, BZ = 0.788; // unit vector perpendicular to classic exit direction
const bar = (cx, cy, cz, len, r = 0.07) => ({ a: [cx - BX * len / 2, cy, cz - BZ * len / 2], b: [cx + BX * len / 2, cy, cz + BZ * len / 2], r, tag: 'bar', show: 'bar' });
const LEVELS = [
  { name: 'Klassisk', goal: 'Få 3 stykker ned i hullet.', short: 'I hullet', target: 3, kind: 'hole',
    path: CLASSIC_PATH, holes: [{ x: 0.3, z: 1.2, r: 0.5, pts: 1 }] },
  { name: 'Nåleøjet', goal: 'Hullet er lille, og kun én bestemt blødhed rammer. Hint: et sted mellem 40 og 65%. Få 2 i.', short: 'I hullet', target: 2, kind: 'hole',
    path: CLASSIC_PATH, holes: [{ x: 0.1, z: 1.12, r: 0.42, pts: 1 }] },
  { name: 'Rampen', goal: 'Stykkerne lander på en glat rampe og glider ned mod hullet. Få 3 i. Juster gnidningen hvis de skyder over.', short: 'I hullet', target: 3, kind: 'hole',
    path: CLASSIC_PATH, holes: [{ x: -1.55, z: 0.21, r: 0.55, pts: 1 }],
    boxes: [{ from: [0.62, 1.45, 1.9], to: [-1.0, 0.42, 0.64], width: 1.4, thick: 0.14, fr: 0.05 },
            { from: [-1.77, 0.42, -0.72], to: [-2.51, 0.42, 0.22], width: 0.18, thick: 0.42 }],
    capsules: [{ a: [0.5, 0, 1.8], b: [0.5, 1.33, 1.8], r: 0.06, show: 'pole' }] },
  { name: 'Skydebanen', goal: 'Blødhed styrer hvor stykket lander: jo blødere, jo tættere på ringen. Hullet længst væk kan kun nås ved at kaste. Nå 6 point.', short: 'Point', target: 6, kind: 'hole',
    path: CLASSIC_PATH,
    holes: [{ x: -0.4, z: 0.95, r: 0.44, pts: 1 }, { x: -1.05, z: 0.2, r: 0.44, pts: 2 }, { x: 1.55, z: 0.25, r: 0.4, pts: 3 }],
    capsules: [bar(0.75, 0.32, 0.75, 1.0, 0.06)] },
  { name: 'Tørresnoren', goal: 'Få 3 stykker til at hænge over den gummibelagte stang. Hårde stykker glider af, for bløde stykker hænger slapt ned. Find midten.', short: 'Hænger', target: 3, kind: 'hang',
    path: CLASSIC_PATH, holes: [], exitBar: { t: 0.55, down: 0.8, len: 1.8, fr: 6, r: 0.14 } },
  { name: 'Spiralen', goal: 'Et langt snoet rør, og hullet ligger langt ude. Hvor blød tør du gå? Få 3 stykker i hullet.', short: 'I hullet', target: 3, kind: 'hole',
    path: HELIX, holes: [{ x: 1.15, z: 0.0, r: 0.5, pts: 1 }], centerPole: [-0.8, -0.3, 9.4] },
  { name: 'Sandkassen', goal: 'Ingen mål. Flyt hullet under "Mere" og leg.', short: 'I hullet', target: 0, kind: 'hole', sandbox: true,
    path: CLASSIC_PATH, holes: [{ x: P.holeX, z: P.holeZ, r: P.holeR, pts: 1 }] }
];

// ---------- renderer / scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_PHONE ? 2 : 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
function gradientTex(stops, w = 2, h = 512) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, h);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = gradientTex([[0, '#d9d9d6'], [0.55, '#a3a3a0'], [1, '#5e5e5c']]);

// studio environment: grey dome with bright softboxes so metal gets crisp, readable reflections
(function studioEnv() {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16),
    new THREE.MeshBasicMaterial({ side: THREE.BackSide, map: gradientTex([[0, '#8a8a88'], [0.5, '#4a4a49'], [1, '#1c1c1c']]) })));
  const box = (w, h, x, y, z, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
  };
  box(16, 7, 0, 22, 2, 3.2);
  box(3, 18, -18, 6, 8, 2.6);
  box(3, 18, 18, 6, 5, 2.2);
  box(12, 4, 2, 4, 20, 1.3);
  box(8, 8, -8, 10, -18, 1.6);
  box(30, 2, 0, -6, 18, 0.5);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.02).texture;
})();

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(3, 14, 7);
key.castShadow = true;
key.shadow.mapSize.set(IS_PHONE ? 1024 : 2048, IS_PHONE ? 1024 : 2048);
Object.assign(key.shadow.camera, { left: -4.5, right: 4.5, top: 6, bottom: -4, near: 2, far: 30 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 3;
const rim = new THREE.DirectionalLight(0xfff4e0, 0.6); rim.position.set(-6, 6, -8);
scene.add(key, rim, new THREE.HemisphereLight(0xffffff, 0x777770, 0.35));

// ---------- marble: tileable fbm noise with sine veins ----------
function marbleTexture(size = 768) {
  // value noise on a lattice that wraps every `per` cells, so the texture tiles seamlessly
  const hash = (x, y, per) => { x = ((x % per) + per) % per; y = ((y % per) + per) % per; const h = Math.sin(x * 127.1 + y * 311.7 + per * 74.7) * 43758.5453; return h - Math.floor(h); };
  // periodic gradient noise (Perlin style), returns roughly 0..1
  const grad = (ix, iy, per, dx, dy) => { const a = hash(ix, iy, per) * Math.PI * 2; return Math.cos(a) * dx + Math.sin(a) * dy; };
  const noise = (x, y, per) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const n00 = grad(xi, yi, per, xf, yf), n10 = grad(xi + 1, yi, per, xf - 1, yf);
    const n01 = grad(xi, yi + 1, per, xf, yf - 1), n11 = grad(xi + 1, yi + 1, per, xf - 1, yf - 1);
    return 0.5 + 0.7 * ((n00 * (1 - u) + n10 * u) * (1 - v) + (n01 * (1 - u) + n11 * u) * v);
  };
  const fbm = (x, y) => { let a = 0, amp = 0.5, f = 3; for (let o = 0; o < 5; o++) { a += amp * noise(x * f, y * f, f); f *= 2; amp *= 0.5; } return a; };
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size), d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / size, v = y / size, n = fbm(u, v), n2 = fbm(u + 0.37, v + 0.71);
    const vein = Math.pow(1 - Math.abs(Math.sin((u * 2 + v * 1) * Math.PI * 2 + n * 9)), 9);
    const fine = Math.pow(1 - Math.abs(Math.sin((u * 3 - v * 2) * Math.PI * 2 + n2 * 14)), 22);
    const cloud = n2 * 0.5;
    const k = 247 - cloud * 26 - vein * 70 - fine * 40;
    const o = (y * size + x) * 4;
    d[o] = k; d[o + 1] = k - 1; d[o + 2] = k - 3; d[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}
const marbleMap = marbleTexture(IS_PHONE ? 512 : 768);
const marble = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: marbleMap, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.08 });
const tubeMarble = marbleMap.clone(); tubeMarble.repeat.set(6, 1); tubeMarble.needsUpdate = true;
const tubeMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: tubeMarble, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.06, thickness: 0.25, ior: 1.45 });
const goldTrim = new THREE.MeshPhysicalMaterial({ color: 0xf2c56b, metalness: 1, roughness: 0.16, clearcoat: 0.3 });
const chrome = new THREE.MeshPhysicalMaterial({ color: 0xf2f2f2, metalness: 1, roughness: 0.06 });
const wellMat = new THREE.MeshStandardMaterial({ color: 0x2c2c2a, roughness: 0.7, side: THREE.BackSide });
const rodMat = new THREE.MeshPhysicalMaterial({ clearcoat: 0.5, clearcoatRoughness: 0.05 });
function applyMetal() { const m = METALS[P.metal]; rodMat.color.setHex(m.color); rodMat.metalness = m.metalness; rodMat.roughness = m.roughness; }
function applyGlass() { tubeMat.transmission = P.glass * 0.92; tubeMat.needsUpdate = true; }
applyMetal(); applyGlass();

// ---------- world (rebuilt per level) ----------
const W = { group: null, holes: [], caps: [], boxes: [], pedR: 3, level: null };
const PATH = { pts: [], cum: [], L: 0, startT: new V(), endT: new V() };
const EXIT = new V(), T = PATH.endT, SIDE = new V(), WUP = new V(), CUT_AT = new V(), PIVOT = new V();
const ARM = 1.9, OPEN = 1.25, LOW = -0.4;
let lever = null;

function buildPath(points) {
  const c = new THREE.CatmullRomCurve3(points.map(p => new V(...p)), false, 'centripetal');
  const pts = c.getSpacedPoints(300);
  PATH.endT.subVectors(pts[300], pts[299]).normalize();
  PATH.startT.subVectors(pts[1], pts[0]).normalize();
  for (let i = 1; i <= 20; i++) pts.push(pts[300].clone().addScaledVector(PATH.endT, 0.5 * i / 20));
  let L = 0; const cum = [0];
  for (let i = 1; i < pts.length; i++) { L += pts[i].distanceTo(pts[i - 1]); cum.push(L); }
  Object.assign(PATH, { pts, cum, L });
}
function pathPos(s, out) {
  const { pts, cum, L } = PATH;
  if (s <= 0) return out.copy(pts[0]).addScaledVector(PATH.startT, s);
  if (s >= L) return out.copy(pts[pts.length - 1]).addScaledVector(PATH.endT, s - L);
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] < s) lo = m; else hi = m; }
  return out.lerpVectors(pts[lo], pts[hi], (s - cum[lo]) / (cum[hi] - cum[lo]));
}
class PathCurve extends THREE.Curve { getPoint(u, out = new V()) { return pathPos(u * PATH.L, out); } }

function shadowy(m, cast = true, recv = true) { m.castShadow = cast; m.receiveShadow = recv; return m; }
function addCapsuleMesh(a, b, r, mat, group) {
  const len = a.distanceTo(b);
  const m = shadowy(new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 20), mat));
  m.position.lerpVectors(a, b, 0.5);
  m.quaternion.setFromUnitVectors(new V(0, 1, 0), _tmp.subVectors(b, a).normalize());
  group.add(m);
}
const _tmp = new V();
function addPole(x, z, top, group, withCollider = true) {
  const a = new V(x, 0, z), b = new V(x, top, z);
  const m = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, top, 20), goldTrim));
  m.position.set(x, top / 2, z); group.add(m);
  const foot = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.05, 32), goldTrim));
  foot.position.set(x, 0.025, z); group.add(foot);
  if (withCollider) W.caps.push(capsule(a, b, 0.06, 'pole'));
}
function capsule(a, b, r, tag, fr = 1) {
  const min = new V().copy(a).min(b).subScalar(r + 0.5), max = new V().copy(a).max(b).addScalar(r + 0.5);
  return { a: a.clone(), b: b.clone(), ab: new V().subVectors(b, a), r, tag, fr, min, max };
}

function buildPedestal(group) {
  const R = W.pedR;
  // side + rounded top edge as one lathe
  const prof = [new THREE.Vector2(R, -7), new THREE.Vector2(R, -0.09)];
  for (let i = 1; i <= 8; i++) { const a = i / 8 * Math.PI / 2; prof.push(new THREE.Vector2(R - 0.09 + Math.cos(a) * 0.09, -0.09 + Math.sin(a) * 0.09)); }

  const env = (a, t, peak, len) => { const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + len); g.connect(a.destination); return g; };

})();

    this.free.fill(true);
    this.pairs = this.pairs.filter(pr => pr.j < this.N);
    for (const pr of this.pairs) pr.rest = pr.k === 1 ? this.seg : Math.min(this.p[pr.i].distanceTo(this.p[pr.j]), pr.k * this.seg);
    if (vel) for (const q of this.q) q.addScaledVector(vel, -DT);
    spawnTimer = 0.8;
  }
  centroid(out) { out.set(0, 0, 0); for (let i = 0; i < this.N; i++) out.add(this.p[i]); return out.multiplyScalar(1 / this.N); }
  step(dt, bs, plast) {
    const g = P.gravity * dt * dt, n = this.p.length, re = this.r * (1 - 0.55 * P.soft);
    this.age += dt; this.plopCool -= dt;
    if (this.attached && this.state === 'hold' && !P.cutter) this.state = 'feed';
    if (this.attached && this.state === 'feed') {
      this.v = Math.min(this.v + P.gravity * 0.5 * dt, P.speed);
      this.f += this.v * dt;
      const tail = this.f - this.len;
      if (P.cutter && tail >= PATH.L - 0.03) {
        this.f = PATH.L - 0.03 + this.len; this.v = 0; this.state = 'hold';
        LV.rod = this; if (LV.state === 'open') LV.state = 'swing';
      } else if (!P.cutter && tail > PATH.L + 0.01) { this.place(); this.release(T.clone().multiplyScalar(this.v)); }
    }
    if (this.attached) this.place();
    let vyMin = 0;
    for (let i = 0; i < n; i++) {
      if (!this.free[i]) continue;
      const p = this.p[i], q = this.q[i];
      if (drag && drag.rod === this && drag.i === i) { q.copy(p); p.lerp(drag.target, 0.25); continue; }
      const vx = (p.x - q.x) * 0.999, vy = (p.y - q.y) * 0.999, vz = (p.z - q.z) * 0.999;
      if (vy < vyMin) vyMin = vy;
      q.copy(p); p.x += vx; p.y += vy - g; p.z += vz;
    }
    const nearEnd = PATH.L - 3 * this.seg;
    this.hit.fill(0);
    for (let it = 0; it < ITERS; it++) {
      for (const pr of this.pairs) {
        const fi = this.free[pr.i], fj = this.free[pr.j];
        if (!fi && !fj) continue;
        if (this.attached && (!fi && this.f - pr.i * this.seg < nearEnd || !fj && this.f - pr.j * this.seg < nearEnd)) continue;
        let wi = fi ? 1 : 0, wj = fj ? 1 : 0;
        if (drag && drag.rod === this) { if (drag.i === pr.i) wi = 0; if (drag.i === pr.j) wj = 0; }
        if (wi + wj === 0) continue;
        const a = this.p[pr.i], b = this.p[pr.j];
        const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, d = Math.hypot(dx, dy, dz) || 1e-6;
        const k = pr.k === 1 ? 1 : bs;
        const c = (d - pr.rest) / d * k / (wi + wj);
        a.x += dx * c * wi; a.y += dy * c * wi; a.z += dz * c * wi;
        b.x -= dx * c * wj; b.y -= dy * c * wj; b.z -= dz * c * wj;
      }
      for (let i = 0; i < n; i++) {
        if (!this.free[i]) continue;
        collideAll(this.p[i], re, this);
        if (CN.hit) {
          this.hit[i] = 1; const o = i * 4;
          this.cn[o] = CN.x; this.cn[o + 1] = CN.y; this.cn[o + 2] = CN.z; this.cn[o + 3] = CN.fr;
          if (CN.tag === 'bar') this.onBar = true;
        }
      }
    }
    // plastic flow: soft material keeps the shape it gets bent into
    if (plast > 0) for (const pr of this.pairs) {
      if (pr.k === 1 || !this.free[pr.i] || !this.free[pr.j]) continue;
      const d = this.p[pr.i].distanceTo(this.p[pr.j]);
      pr.rest = Math.min(pr.k * this.seg, pr.rest + (d - pr.rest) * plast);
    }
    // friction along whatever surface each particle touches
    let anyHit = false;
    for (let i = 0; i < n; i++) {
      if (!this.free[i] || !this.hit[i]) continue;
      anyHit = true;
      const o = i * 4, nx = this.cn[o], ny = this.cn[o + 1], nz = this.cn[o + 2], fr = Math.min(1, P.friction * 0.6 * this.cn[o + 3]);
      const p = this.p[i], q = this.q[i];
      const vx = p.x - q.x, vy = p.y - q.y, vz = p.z - q.z, vn = vx * nx + vy * ny + vz * nz;
      const tx = vx - nx * vn, ty = vy - ny * vn, tz = vz - nz * vn;
      q.x += tx * fr; q.y += ty * fr; q.z += tz * fr;
    }
    if (!this.attached && anyHit && vyMin < -2.2 * dt && this.plopCool <= 0) { sfx.plop(-vyMin / dt); this.plopCool = 0.35; }
  }
  maxSpeed(dt) { let m = 0; for (let i = 0; i < this.N; i++) m = Math.max(m, this.p[i].distanceToSquared(this.q[i])); return Math.sqrt(m) / dt; }
  render() {
    for (let i = 0; i < this.N; i++) this.pts[i].copy(this.p[i]);
    this.mesh.update(this.pts, this.r, !this.attached || P.soft > 0);
  }
  dispose() { this.mesh.mesh.parent?.remove(this.mesh.mesh); this.mesh.mesh.geometry.dispose(); if (drag && drag.rod === this) endDrag(); }
}

// particles of different pieces (and far-apart parts of the same piece) push each other apart
const list = [];
function interCollide() {
  list.length = 0;
  for (const rod of rods) for (let i = 0; i < rod.N; i++) if (rod.free[i]) list.push(rod, i);
  const sq = 1 - 0.45 * P.soft;
  for (let a = 0; a < list.length; a += 2) {
    const ra = list[a], ia = list[a + 1], pa = ra.p[ia];
    for (let b = a + 2; b < list.length; b += 2) {
      const rb = list[b], ib = list[b + 1];
      if (ra === rb && Math.abs(ia - ib) < ra.selfSkip) continue;
      const pb = rb.p[ib], min = (ra.r + rb.r) * sq;
      const dx = pb.x - pa.x, dy = pb.y - pa.y, dz = pb.z - pa.z, d2 = dx * dx + dy * dy + dz * dz;
      if (d2 >= min * min || d2 < 1e-10) continue;
      const d = Math.sqrt(d2), c = (min - d) / d * 0.5;
      pa.x -= dx * c; pa.y -= dy * c; pa.z -= dz * c;
      pb.x += dx * c; pb.y += dy * c; pb.z += dz * c;
    }
  }
}

function attachedRod() { return rods.find(r => r.attached); }
function spawn() {
  if (attachedRod()) return;
  rods.push(new Rod());
  const free = rods.filter(r => !r.attached);
  while (free.length > P.maxPieces) { const old = free.shift(); old.dispose(); rods.splice(rods.indexOf(old), 1); }
}
function removeRod(r) { r.dispose(); rods.splice(rods.indexOf(r), 1); }

// ---------- scoring ----------
let score = 0, levelIdx = 0, bannerShown = false;
const _cen = new V();
function award(rod, pts, at) {
  rod.scored = true; score += pts;
  popup('+' + pts, at);
  updateScore();
  const L = W.level;
  sfx.chime(L.target && score >= L.target);
  if (L.target && score >= L.target && !bannerShown) {
    bannerShown = true; markDone(levelIdx);
    setTimeout(() => showBanner(), 700);
  }
}
function checkScoring(dt) {
  const L = W.level;
  for (let i = rods.length - 1; i >= 0; i--) {
    const r = rods[i];
    if (r.attached) continue;
    r.centroid(_cen);
    if (L.kind === 'hole' && !r.scored && _cen.y < -0.6) {
      const h = holeAt(_cen.x, _cen.z, 0.05);
      if (h && Math.hypot(_cen.x, _cen.z) < W.pedR) award(r, h.pts, _tmp.set(h.x, 0.3, h.z));
    }
    if (L.kind === 'hang' && !r.scored) {
      if (r.onBar && r.maxSpeed(dt) < 0.8 && _cen.y > 0.6) { r.restT += dt; if (r.restT > 1.2) award(r, 1, _tmp.copy(_cen).setY(_cen.y + 0.5)); }
      else r.restT = 0;
      r.onBar = false;
    }
    if (r.p.every(p => p.y < -4)) removeRod(r);
  }
}

function simStep(dt) {
  const s = P.soft;
  const bs = Math.pow(1 - s, 4) * (0.3 + 0.7 * Math.pow(1 - s, 12));
  const plast = Math.pow(s, 1.5) * 0.02;
  leverStep(dt);
  for (const rod of rods) rod.step(dt, bs, plast);
  interCollide();
  checkScoring(dt);
  if (spawnTimer > 0) { spawnTimer -= dt; if (spawnTimer <= 0 && P.auto) spawn(); }
}

// ---------- camera ----------
let controls;
function camHome() {
  const a = innerWidth / innerHeight, k = a < 0.8 ? 1.5 : 1;
  camera.position.set(3.4 * k, 7.4 + (k - 1) * 3, 14.5 * k);
  controls.target.set(0, 3.4, 0.3); controls.update();
}

// ---------- dragging pieces ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(), hit = new V();
function setRay(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
renderer.domElement.addEventListener('pointerdown', e => {
  setRay(e);
  let best = null, bestT = Infinity;
  for (const rod of rods) {
    if (rod.attached) continue;
    for (let i = 0; i < rod.N; i++) {
      const p = rod.p[i];
      if (ray.ray.distanceSqToPoint(p) < (rod.r * 1.8) ** 2) {
        const t = _v.subVectors(p, ray.ray.origin).dot(ray.ray.direction);
        if (t < bestT) { bestT = t; best = { rod, i }; }
      }
    }
  }
  if (!best) return;
  controls.enabled = false;
  plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(_a).negate(), best.rod.p[best.i]);
  drag = { ...best, target: best.rod.p[best.i].clone() };
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!drag) return;
  setRay(e);
  if (ray.ray.intersectPlane(plane, hit)) { drag.target.copy(hit); drag.target.y = Math.max(drag.target.y, 0.1); }
});
function endDrag() { if (drag) { drag = null; controls.enabled = true; } }
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 4; controls.maxDistance = 32;
controls.maxPolarAngle = Math.PI * 0.62;

// keep the machine centred in the space the panel leaves free
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const panel = document.getElementById('panel');
  if (w > 640) { const pw = panel.offsetWidth + 16; camera.setViewOffset(w + pw, h, pw, 0, w, h); }
  else { const ph = Math.min(panel.offsetHeight, h * 0.4) * 0.8; camera.setViewOffset(w, h + ph, 0, ph, w, h); }
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---------- UI ----------
const $ = id => document.getElementById(id);
function popup(text, at) {
  const v = at.clone().project(camera);
  const el = document.createElement('div'); el.className = 'pop'; el.textContent = text;
  el.style.left = (v.x + 1) / 2 * innerWidth + 'px'; el.style.top = (1 - v.y) / 2 * innerHeight + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1200);
}
let done = {};
try { done = JSON.parse(localStorage.getItem('softsim-done') || '{}'); } catch {}
function markDone(i) { done[i] = true; try { localStorage.setItem('softsim-done', JSON.stringify(done)); } catch {} fillLevelSelect(); }
function fillLevelSelect() {
  $('lvlSelect').innerHTML = LEVELS.map((L, i) => `<option value="${i}" ${i === levelIdx ? 'selected' : ''}>${i + 1}. ${L.name}${done[i] ? '  ✓' : ''}</option>`).join('');
}
function updateScore() {
  const L = W.level;
  $('goalShort').textContent = L.short;
  $('score').textContent = L.target ? `${Math.min(score, 99)} / ${L.target}` : String(score);
}
function showBanner() {
  const next = levelIdx + 1 < LEVELS.length;
  $('bannerText').textContent = next ? `Du klarede ${W.level.name}. Næste: ${LEVELS[levelIdx + 1].name}.` : 'Du har klaret alle baner. Sandkassen er din.';
  $('nextBtn').hidden = !next;
  $('banner').hidden = false;
}
function loadLevel(i) {
  levelIdx = (i + LEVELS.length) % LEVELS.length;
  endDrag();
  for (const r of rods) r.dispose();
  rods.length = 0;
  score = 0; bannerShown = false; $('banner').hidden = true;
  buildLevel(LEVELS[levelIdx]);
  $('goalText').textContent = LEVELS[levelIdx].goal;
  $('sandboxGroup').hidden = !LEVELS[levelIdx].sandbox;
  fillLevelSelect(); updateScore();
  spawnTimer = 0.4;
  try { localStorage.setItem('softsim-level', levelIdx); } catch {}
}

const label = $('softLabel');
function setSoft(v) {
  P.soft = v / 100;
  $('soft').value = v; $('v-soft').textContent = v + '%';
  label.textContent = v + '% blød';
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', +c.dataset.v === v));
}
for (const v of [0, 25, 50, 75, 100]) {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.v = v; b.textContent = v + '%';
  b.onclick = () => setSoft(v);
  $('chips').appendChild(b);
}
$('soft').addEventListener('input', e => setSoft(+e.target.value));

function rebuildSandbox() { if (W.level.sandbox) { const keep = levelIdx; loadLevel(keep); } }
const GROUPS = [
  ['Stang', [
    { key: 'length', label: 'Længde', min: 0.8, max: 4, step: 0.1, fmt: v => v.toFixed(1) },
    { key: 'radius', label: 'Tykkelse', min: 0.08, max: 0.34, step: 0.01, fmt: v => v.toFixed(2) },
    { key: 'speed', label: 'Fart ind i røret', min: 0.5, max: 10, step: 0.1, fmt: v => v.toFixed(1) },
    { key: 'metal', label: 'Materiale', options: METALS, on: applyMetal }
  ]],
  ['Fysik', [
    { key: 'gravity', label: 'Tyngdekraft', min: 1, max: 30, step: 0.1, fmt: v => v.toFixed(1) + ' m/s²' },
    { key: 'friction', label: 'Gnidning', min: 0, max: 1, step: 0.01, fmt: v => Math.round(v * 100) + '%' },
    { key: 'slowmo', label: 'Tid', min: 0.05, max: 1.5, step: 0.05, fmt: v => v.toFixed(2) + '×' },
    { key: 'maxPieces', label: 'Max stykker på bordet', min: 1, max: 15, step: 1, fmt: v => v }
  ]],
  ['Hullet', [
    { key: 'holeX', label: 'Hul, side', min: -2.2, max: 2.2, step: 0.05, fmt: v => v.toFixed(2), on: rebuildSandbox, lazy: true },
    { key: 'holeZ', label: 'Hul, frem', min: -2.2, max: 2.2, step: 0.05, fmt: v => v.toFixed(2), on: rebuildSandbox, lazy: true },
    { key: 'holeR', label: 'Hulstørrelse', min: 0.15, max: 1.2, step: 0.01, fmt: v => v.toFixed(2), on: rebuildSandbox, lazy: true }
  ], 'sandboxGroup'],
  ['Maskine', [
    { key: 'glass', label: 'Gennemsigtigt rør', min: 0, max: 1, step: 0.01, fmt: v => Math.round(v * 100) + '%', on: applyGlass },
    { key: 'auto', label: 'Kør automatisk', toggle: true },
    { key: 'cutter', label: 'Kniv skærer stangen', toggle: true },
    { key: 'sound', label: 'Lyd', toggle: true }
  ]]
];
const more = $('more');
for (const [title, ctls, gid] of GROUPS) {
  const g = document.createElement('div'); g.className = 'group'; if (gid) g.id = gid;
  g.innerHTML = `<h3>${title}</h3>`;
  for (const c of ctls) {
    const d = document.createElement('div'); d.className = 'ctl';
    if (c.toggle) {
      d.innerHTML = `<label class="toggle"><input type="checkbox" id="c-${c.key}" ${P[c.key] ? 'checked' : ''}>${c.label}</label>`;
      d.querySelector('input').onchange = e => { P[c.key] = e.target.checked; if (c.key === 'auto' && P.auto && !attachedRod()) spawnTimer = 0.2; };
    } else if (c.options) {
      d.innerHTML = `<div class="row"><label for="c-${c.key}">${c.label}</label></div><select id="c-${c.key}">${Object.entries(c.options).map(([k, o]) => `<option value="${k}" ${k === P[c.key] ? 'selected' : ''}>${o.label}</option>`).join('')}</select>`;
      d.querySelector('select').onchange = e => { P[c.key] = e.target.value; c.on && c.on(); };
    } else {
      d.innerHTML = `<div class="row"><label for="c-${c.key}">${c.label}</label><span class="val">${c.fmt(P[c.key])}</span></div><input type="range" id="c-${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${P[c.key]}">`;
      const val = d.querySelector('.val'), inp = d.querySelector('input');
      inp.oninput = e => { P[c.key] = +e.target.value; val.textContent = c.fmt(P[c.key]); if (!c.lazy && c.on) c.on(); };
      if (c.lazy) inp.onchange = () => c.on();
    }
    g.appendChild(d);
  }
  more.appendChild(g);
}
const g2 = document.createElement('div'); g2.className = 'group';
g2.innerHTML = `<div class="btns"><button class="btn" id="camBtn">Nulstil kamera</button><button class="btn" id="restartBtn">Start banen forfra</button></div>
<p class="hint">Træk i et stykke for at kaste rundt med det. Træk i baggrunden for at dreje kameraet, knib eller scroll for at zoome. Mellemrum slipper en ny stang.</p>`;
more.appendChild(g2);
$('camBtn').onclick = camHome;
$('restartBtn').onclick = () => loadLevel(levelIdx);
$('dropBtn').onclick = () => spawn();
$('clearBtn').onclick = () => { endDrag(); for (const r of rods.filter(r => !r.attached)) removeRod(r); };
$('moreBtn').onclick = () => { const o = $('panel').classList.toggle('open'); $('moreBtn').textContent = o ? 'Mindre' : 'Mere'; resize(); };
$('prevLvl').onclick = () => loadLevel(levelIdx - 1);
$('nextLvl').onclick = () => loadLevel(levelIdx + 1);
$('lvlSelect').onchange = e => loadLevel(+e.target.value);
$('nextBtn').onclick = () => loadLevel(levelIdx + 1);
$('stayBtn').onclick = () => { $('banner').hidden = true; };
addEventListener('keydown', e => { if (e.code === 'Space' && !['BUTTON', 'SELECT'].includes(e.target.tagName)) { e.preventDefault(); spawn(); } });

setSoft(50);
let startLevel = 0;
try { startLevel = +(localStorage.getItem('softsim-level') || 0) || 0; } catch {}
loadLevel(Math.min(startLevel, LEVELS.length - 1));
resize(); camHome();

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  acc += dt * P.slowmo;
  let steps = 0;
  while (acc >= DT && steps < 12) { simStep(DT); acc -= DT; steps++; }
  if (steps === 12) acc = 0;
  poseLever();
  for (const r of rods) r.render();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
