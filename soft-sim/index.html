<title>Blød Stang Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;1,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage, floating glass control panel (right on desktop, bottom sheet on phone) */
:root{
  --stage-top:#c9c9c7; --stage-bottom:#6f6f6d;
  --panel:rgba(22,22,24,.84); --fg:#f3f0e9; --muted:#a8a49b; --gold:#e0b65c; --line:rgba(255,255,255,.12);
  --display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 20%, var(--stage-top), var(--stage-bottom));color:var(--fg);font-family:var(--display);overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#softLabel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;text-align:center;pointer-events:none;
  font:italic 800 clamp(28px,5vw,44px)/1 var(--display);color:#fff;letter-spacing:.01em;text-shadow:0 2px 14px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.6)}
.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px, env(safe-area-inset-right,0px));width:300px;
  max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;touch-action:pan-y}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.big{font-weight:600;font-size:15px}
.val{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--gold);font-size:13px}
input[type=range]{width:100%;accent-color:var(--gold);margin:4px 0 0}
.chips{display:flex;gap:6px}
.chip,.btn{font:600 13px var(--display);color:var(--fg);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;padding:7px 0;cursor:pointer;flex:1}
.chip.on{background:var(--gold);color:#1a1712;border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1a1712;border-color:var(--gold)}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns .btn{padding:9px 10px}
.group{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.group h3{margin:0;font:600 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ctl label{font-size:13px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.toggle input{accent-color:var(--gold);width:16px;height:16px}
select{width:100%;font:13px var(--display);background:rgba(255,255,255,.07);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px}
select option{background:#222;color:var(--fg)}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
#moreBtn{display:none}
@media (max-width:640px){
  .panel{top:auto;width:auto;left:max(12px, env(safe-area-inset-left,0px));right:max(12px, env(safe-area-inset-right,0px));
    bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-height:58%;padding:12px 14px;gap:10px}
  #moreBtn{display:block}
  .panel:not(.open) .more{display:none}
}
</style>

<div id="stage"></div>
<div id="softLabel">50% blød</div>

<div class="panel" id="panel">
  <div class="ctl">
    <div class="row"><span class="big">Blødhed</span><span class="val" id="v-soft">50%</span></div>
    <input type="range" id="soft" min="0" max="100" step="1" value="50" aria-label="Blødhed">
  </div>
  <div class="chips" id="chips"></div>
  <div class="btns">
    <button class="btn primary" id="dropBtn" style="flex:2">Slip én</button>
    <button class="btn" id="clearBtn">Ryd</button>
    <button class="btn" id="moreBtn">Mere</button>
  </div>
  <div class="more" id="more"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V = THREE.Vector3;
const DT = 1 / 240, ITERS = 12, PED_R = 3, TUBE_R = 0.42;

// ---------- parameters ----------
const P = {
  soft: 0.5, length: 2.2, radius: 0.2, speed: 3.5, gravity: 9.8, friction: 0.5, slowmo: 1,
  maxPieces: 6, holeX: 0.3, holeZ: 1.2, holeR: 0.5, glass: 0.35, auto: true, cutter: true, metal: 'gold'
};
const METALS = {
  gold:   { label: 'Guld',   color: 0xf2c46a, metalness: 1, roughness: 0.14 },
  silver: { label: 'Sølv',   color: 0xe8e8ec, metalness: 1, roughness: 0.12 },
  copper: { label: 'Kobber', color: 0xe08a5c, metalness: 1, roughness: 0.18 },
  rose:   { label: 'Rosaguld', color: 0xf0b0a0, metalness: 1, roughness: 0.15 },
  slime:  { label: 'Slim',   color: 0x58d36a, metalness: 0, roughness: 0.08 },
  candy:  { label: 'Slik',   color: 0xff5fa2, metalness: 0.1, roughness: 0.25 }
};

// ---------- renderer / scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 12, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 30 });
key.shadow.bias = -0.0005;
scene.add(key, new THREE.HemisphereLight(0xffffff, 0x888888, 0.5));

// ---------- materials ----------
function marbleTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#eeedea'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * 1024, y = Math.random() * 1024, r = 60 + Math.random() * 220;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(160,160,155,0.10)'); gr.addColorStop(1, 'rgba(160,160,155,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let v = 0; v < 18; v++) {
    let x = Math.random() * 1024, y = Math.random() * 1024, a = Math.random() * Math.PI * 2;
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 140; s++) { a += (Math.random() - 0.5) * 0.5; x += Math.cos(a) * 7; y += Math.sin(a) * 7; g.lineTo(x, y); }
    g.strokeStyle = `rgba(115,115,112,${0.12 + Math.random() * 0.25})`;
    g.lineWidth = 0.5 + Math.random() * 1.8; g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}
const marbleMap = marbleTexture();
const marble = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: marbleMap, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.15 });
const tubeMat = marble.clone();
tubeMat.side = THREE.DoubleSide;
const goldTrim = new THREE.MeshStandardMaterial({ color: 0xf0c46a, metalness: 1, roughness: 0.18 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 1, roughness: 0.1 });
const rodMat = new THREE.MeshPhysicalMaterial({ clearcoat: 0.4, clearcoatRoughness: 0.1 });
function applyMetal() { const m = METALS[P.metal]; rodMat.color.setHex(m.color); rodMat.metalness = m.metalness; rodMat.roughness = m.roughness; }
applyMetal();
function applyGlass() {
  tubeMat.transparent = P.glass > 0.01; tubeMat.opacity = 1 - P.glass * 0.85; tubeMat.depthWrite = P.glass <= 0.01; tubeMat.needsUpdate = true;
}
applyGlass();

// ---------- tube path (arc-length lookup) ----------
const PATH = { pts: [], cum: [], L: 0, startT: new V(), endT: new V() };
(function buildPath() {
  const c = new THREE.CubicBezierCurve3(new V(-1.7, 8.6, -0.9), new V(-1.7, 5.8, -0.9), new V(-1.55, 4.85, -0.15), new V(-0.85, 4.75, 0.4));
  const pts = [];
  for (let i = 0; i <= 200; i++) pts.push(c.getPoint(i / 200));
  PATH.endT.subVectors(pts[200], pts[199]).normalize();
  PATH.startT.subVectors(pts[1], pts[0]).normalize();
  for (let i = 1; i <= 20; i++) pts.push(pts[200].clone().addScaledVector(PATH.endT, 0.5 * i / 20));
  let L = 0; const cum = [0];
  for (let i = 1; i < pts.length; i++) { L += pts[i].distanceTo(pts[i - 1]); cum.push(L); }
  Object.assign(PATH, { pts, cum, L });
})();
function pathPos(s, out) {
  const { pts, cum, L } = PATH;
  if (s <= 0) return out.copy(pts[0]).addScaledVector(PATH.startT, s);
  if (s >= L) return out.copy(pts[pts.length - 1]).addScaledVector(PATH.endT, s - L);
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] < s) lo = m; else hi = m; }
  return out.lerpVectors(pts[lo], pts[hi], (s - cum[lo]) / (cum[hi] - cum[lo]));
}
const EXIT = pathPos(PATH.L, new V());
const T = PATH.endT;

// ---------- static scene: pedestal, tube, ring, poles, lever ----------
class PathCurve extends THREE.Curve { getPoint(u, out = new V()) { return pathPos(u * PATH.L, out); } }
const tube = new THREE.Mesh(new THREE.TubeGeometry(new PathCurve(), 160, TUBE_R, 40, false), tubeMat);
tube.castShadow = true;
scene.add(tube);

const ringQ = new THREE.Quaternion().setFromUnitVectors(new V(0, 0, 1), T);
const ring = new THREE.Mesh(new THREE.TorusGeometry(TUBE_R + 0.14, 0.17, 24, 64), marble);
ring.position.copy(EXIT); ring.quaternion.copy(ringQ); ring.castShadow = true;
const ringGold = new THREE.Mesh(new THREE.TorusGeometry(TUBE_R + 0.02, 0.035, 12, 64), goldTrim);
ringGold.position.copy(EXIT).addScaledVector(T, 0.12); ringGold.quaternion.copy(ringQ);
const ringGold2 = new THREE.Mesh(new THREE.TorusGeometry(TUBE_R + 0.3, 0.025, 12, 64), goldTrim);
ringGold2.position.copy(EXIT).addScaledVector(T, 0.06); ringGold2.quaternion.copy(ringQ);
scene.add(ring, ringGold, ringGold2);

function pole(x, z, top) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, top, 16), goldTrim);
  m.position.set(x, top / 2, z); m.castShadow = true; scene.add(m);
}
pole(-1.7, -0.9, 5.6);

// pedestal
const pedSide = new THREE.Mesh(new THREE.CylinderGeometry(PED_R, PED_R, 6, 96, 1, true), marble);
pedSide.position.y = -3; pedSide.receiveShadow = true; scene.add(pedSide);
for (const y of [-0.06, -1.4, -1.55]) {
  const band = new THREE.Mesh(new THREE.TorusGeometry(PED_R + 0.01, 0.035, 10, 128), goldTrim);
  band.rotation.x = Math.PI / 2; band.position.y = y; scene.add(band);
}
let pedTop, holeWell, holeRim;
const wellMat = new THREE.MeshStandardMaterial({ color: 0x3a3a38, roughness: 0.6, side: THREE.BackSide });
function buildTop() {
  for (const m of [pedTop, holeWell, holeRim]) if (m) { scene.remove(m); m.geometry.dispose(); }
  const shape = new THREE.Shape(); shape.absarc(0, 0, PED_R, 0, Math.PI * 2, false);
  const hole = new THREE.Path(); hole.absarc(P.holeX, -P.holeZ, P.holeR, 0, Math.PI * 2, true);
  shape.holes.push(hole);
  const g = new THREE.ShapeGeometry(shape, 96); g.rotateX(-Math.PI / 2);
  const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 6 + .5, uv.getY(i) / 6 + .5);
  pedTop = new THREE.Mesh(g, marble); pedTop.receiveShadow = true;
  holeWell = new THREE.Mesh(new THREE.CylinderGeometry(P.holeR, P.holeR, 2, 48, 1, true), wellMat);
  holeWell.position.set(P.holeX, -1, P.holeZ);
  holeRim = new THREE.Mesh(new THREE.TorusGeometry(P.holeR, 0.045, 12, 64), goldTrim);
  holeRim.rotation.x = Math.PI / 2; holeRim.position.set(P.holeX, 0.01, P.holeZ); holeRim.castShadow = true;
  scene.add(pedTop, holeWell, holeRim);
}
buildTop();

// lever: swings in the plane right in front of the ring and slices the rod off
const SIDE = new V().crossVectors(T, new V(0, 1, 0)).normalize();
const WUP = new V().crossVectors(SIDE, T).normalize();
const CUT_AT = EXIT.clone().addScaledVector(T, 0.12);
const PIVOT = CUT_AT.clone().addScaledVector(SIDE, -1.6);
const ARM = 1.6 + 0.3, OPEN = 1.25, LOW = -0.4;
pole(PIVOT.x, PIVOT.z, PIVOT.y);
const lever = new THREE.Group(); lever.position.copy(PIVOT); scene.add(lever);
{
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, ARM, 12), chrome);
  arm.rotation.z = -Math.PI / 2; arm.position.x = ARM / 2; arm.castShadow = true;
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.03, 0.3), chrome);
  blade.position.x = ARM - 0.15; blade.castShadow = true;
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 16), chrome);
  lever.add(arm, blade, ball);
}
const LV = { a: OPEN, state: 'open', rod: null };
const _x = new V(), _y = new V(), _m = new THREE.Matrix4();
function poseLever() {
  _x.copy(SIDE).multiplyScalar(Math.cos(LV.a)).addScaledVector(WUP, Math.sin(LV.a));
  _y.crossVectors(T, _x);
  lever.quaternion.setFromRotationMatrix(_m.makeBasis(_x, _y, T));
}
function leverStep(dt) {
  const prev = LV.a;
  if (LV.state === 'swing') {
    LV.a -= 9 * dt;
    if (prev > 0 && LV.a <= 0 && LV.rod) { LV.rod.release(WUP.clone().multiplyScalar(-1.6).addScaledVector(T, 0.4)); LV.rod = null; }
    if (LV.a <= LOW) { LV.a = LOW; LV.state = 'back'; }
  } else if (LV.state === 'back') {
    LV.a += 2.5 * dt;
    if (LV.a >= OPEN) { LV.a = OPEN; LV.state = LV.rod ? 'swing' : 'open'; }
  }
}
poseLever();

// ---------- rod rendering: tube through the particles with round caps ----------
const RAD = 20, CAP = 7;
const _c = new V(), _n = new V(), _b = new V(), _r = new V(), _t = new V(), _v = new V(), _a = new V();
class RodMesh {
  constructor(n) {
    this.M = (n - 1) * 3;
    this.rings = CAP * 2 + this.M + 1;
    const verts = this.rings * (RAD + 1);
    this.pos = new Float32Array(verts * 3); this.nor = new Float32Array(verts * 3);
    const idx = [];
    for (let r = 0; r < this.rings - 1; r++) for (let k = 0; k < RAD; k++) {
      const a = r * (RAD + 1) + k, b = a + RAD + 1;
      idx.push(a, a + 1, b, b, a + 1, b + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(this.nor, 3));
    g.setIndex(idx);
    this.mesh = new THREE.Mesh(g, rodMat);
    this.mesh.castShadow = this.mesh.receiveShadow = true;
    this.mesh.frustumCulled = false;
    this.cs = []; this.ts = []; this.ns = [];
    for (let i = 0; i <= this.M; i++) { this.ts.push(new V()); this.ns.push(new V()); }
  }
  update(points, r, squish) {
    const cs = new THREE.CatmullRomCurve3(points, false, 'centripetal').getPoints(this.M);
    const M = this.M, ts = this.ts, ns = this.ns;
    for (let k = 0; k <= M; k++) {
      ts[k].subVectors(cs[Math.min(M, k + 1)], cs[Math.max(0, k - 1)]).normalize();
    }
    // parallel transport frames
    const t0 = ts[0];
    _a.set(1, 0, 0); if (Math.abs(t0.x) > 0.8) _a.set(0, 1, 0);
    ns[0].crossVectors(t0, _a).normalize();
    for (let k = 1; k <= M; k++) {
      ns[k].copy(ns[k - 1]).addScaledVector(ts[k], -ts[k].dot(ns[k - 1])).normalize();
    }
    let ri = 0;
    const ring = (center, rad, k, capDir, capW) => {
      const t = ts[k]; _n.copy(ns[k]); _b.crossVectors(t, _n);
      for (let j = 0; j <= RAD; j++) {
        const th = j / RAD * Math.PI * 2;
        _r.copy(_n).multiplyScalar(Math.cos(th)).addScaledVector(_b, Math.sin(th));
        _v.copy(center).addScaledVector(_r, rad);
        _t.copy(_r).multiplyScalar(Math.sqrt(1 - capW * capW));
        if (capDir) _t.addScaledVector(capDir, capW);
        if (squish && _v.y < 0.004 && onSolidTop(_v.x, _v.z)) {
          const dy = 0.004 - _v.y, hl = Math.hypot(_r.x, _r.z) || 1;
          _v.y = 0.004; _v.x += _r.x / hl * dy * 0.4; _v.z += _r.z / hl * dy * 0.4;
          _t.set(_r.x * 0.5, 0.85, _r.z * 0.5).normalize();
        }
        const o = (ri * (RAD + 1) + j) * 3;
        this.pos[o] = _v.x; this.pos[o + 1] = _v.y; this.pos[o + 2] = _v.z;
        this.nor[o] = _t.x; this.nor[o + 1] = _t.y; this.nor[o + 2] = _t.z;
      }
      ri++;
    };
    const back = ts[0].clone().negate();
    for (let j = 0; j < CAP; j++) {
      const ang = Math.PI / 2 * (1 - j / CAP);
      ring(_c.copy(cs[0]).addScaledVector(back, r * Math.sin(ang)).clone(), r * Math.cos(ang), 0, back, Math.sin(ang));
    }
    for (let k = 0; k <= M; k++) ring(cs[k], r, k, null, 0);
    for (let j = 1; j <= CAP; j++) {
      const ang = Math.PI / 2 * j / CAP;
      ring(_c.copy(cs[M]).addScaledVector(ts[M], r * Math.sin(ang)).clone(), r * Math.cos(ang), M, ts[M], Math.sin(ang));
    }
    const g = this.mesh.geometry;
    g.attributes.position.needsUpdate = true; g.attributes.normal.needsUpdate = true;
  }
}

// ---------- physics ----------
function onSolidTop(x, z) {
  return x * x + z * z < PED_R * PED_R && (x - P.holeX) ** 2 + (z - P.holeZ) ** 2 > P.holeR * P.holeR;
}
// sphere (particle) vs pedestal top, hole rim/well, and outer edge
function collide(p, re) {
  const dx = p.x - P.holeX, dz = p.z - P.holeZ, dh = Math.hypot(dx, dz) || 1e-6;
  const dc = Math.hypot(p.x, p.z) || 1e-6;
  let contact = false;
  const edgePush = (ex, ez) => {
    const ax = p.x - ex, ay = p.y, az = p.z - ez, d = Math.hypot(ax, ay, az);
    if (d < re && d > 1e-6) { const s = (re - d) / d; p.x += ax * s; p.y += ay * s; p.z += az * s; contact = true; }
  };
  if (dc < PED_R) {
    if (dh > P.holeR && p.y < re && p.y > -0.6) { p.y = re; contact = true; }
    if (dh < P.holeR + re && p.y < re) {
      if (p.y < 0) {
        if (dh > P.holeR - re) { const s = Math.max(0, P.holeR - re) / dh; p.x = P.holeX + dx * s; p.z = P.holeZ + dz * s; contact = true; }
      } else edgePush(P.holeX + dx / dh * P.holeR, P.holeZ + dz / dh * P.holeR);
    }
  } else if (dc < PED_R + re && p.y < re) {
    if (p.y < 0) { const s = (PED_R + re) / dc; p.x *= s; p.z *= s; contact = true; }
    else edgePush(p.x / dc * PED_R, p.z / dc * PED_R);
  }
  return contact;
}

const rods = [];
let drag = null; // { rod, i, target }

class Rod {
  constructor() {
    this.N = Math.min(44, Math.max(10, Math.round(P.length / 0.09) + 1));
    this.len = P.length; this.seg = this.len / (this.N - 1); this.r = P.radius;
    this.selfSkip = Math.ceil(2.4 * this.r / this.seg) + 1;
    this.p = []; this.q = []; this.free = []; this.contact = [];
    for (let i = 0; i <= this.N; i++) { this.p.push(new V()); this.q.push(new V()); this.free.push(false); this.contact.push(false); }
    this.pairs = [];
    for (let i = 0; i <= this.N; i++) for (let j = i + 1; j <= this.N; j++) this.pairs.push({ i, j, k: j - i, rest: (j - i) * this.seg });
    this.attached = true; this.f = -0.1; this.v = 0; this.state = 'feed';
    this.mesh = new RodMesh(this.N); scene.add(this.mesh.mesh);
    this.pts = Array.from({ length: this.N }, () => new V());
    this.place();
  }
  place() {
    for (let i = 0; i < this.p.length; i++) {
      if (this.free[i]) continue;
      const s = this.f - i * this.seg;
      if (s > PATH.L) { this.free[i] = true; }
      pathPos(s, this.p[i]); pathPos(s - this.v * DT, this.q[i]);
    }
  }
  release(vel) {
    this.attached = false; this.state = 'free';
    this.p.length = this.q.length = this.free.length = this.N;
    this.free.fill(true);
    this.pairs = this.pairs.filter(pr => pr.j < this.N);
    for (const pr of this.pairs) pr.rest = pr.k === 1 ? this.seg : Math.min(this.p[pr.i].distanceTo(this.p[pr.j]), pr.k * this.seg);
    if (vel) for (const q of this.q) q.addScaledVector(vel, -DT);
    spawnTimer = 0.8;
  }
  step(dt, bs, plast) {
    const g = P.gravity * dt * dt, n = this.p.length, re = this.r * (1 - 0.55 * P.soft);
    if (this.attached && this.state === 'feed') {
      this.v = Math.min(this.v + P.gravity * 0.5 * dt, P.speed);
      this.f += this.v * dt;
      const tail = this.f - this.len;
      if (P.cutter && tail >= PATH.L - 0.03) {
        this.f = PATH.L - 0.03 + this.len; this.v = 0; this.state = 'hold';
        LV.rod = this; if (LV.state === 'open') LV.state = 'swing';
      } else if (!P.cutter && tail > PATH.L + 0.01) { this.place(); this.release(T.clone().multiplyScalar(this.v)); }
    }
    if (this.attached) this.place();
    for (let i = 0; i < n; i++) {
      if (!this.free[i]) continue;
      const p = this.p[i], q = this.q[i];
      if (drag && drag.rod === this && drag.i === i) { q.copy(p); p.lerp(drag.target, 0.25); continue; }
      const vx = (p.x - q.x) * 0.999, vy = (p.y - q.y) * 0.999, vz = (p.z - q.z) * 0.999;
      q.copy(p); p.x += vx; p.y += vy - g; p.z += vz;
    }
    const nearEnd = PATH.L - 3 * this.seg;
    for (let it = 0; it < ITERS; it++) {
      for (const pr of this.pairs) {
        const fi = this.free[pr.i], fj = this.free[pr.j];
        if (!fi && !fj) continue;
        if (this.attached && (!fi && this.f - pr.i * this.seg < nearEnd || !fj && this.f - pr.j * this.seg < nearEnd)) continue;
        let wi = fi ? 1 : 0, wj = fj ? 1 : 0;
        if (drag && drag.rod === this) { if (drag.i === pr.i) wi = 0; if (drag.i === pr.j) wj = 0; }
        if (wi + wj === 0) continue;
        const a = this.p[pr.i], b = this.p[pr.j];
        const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, d = Math.hypot(dx, dy, dz) || 1e-6;
        const k = pr.k === 1 ? 1 : bs;
        const c = (d - pr.rest) / d * k / (wi + wj);
        a.x += dx * c * wi; a.y += dy * c * wi; a.z += dz * c * wi;
        b.x -= dx * c * wj; b.y -= dy * c * wj; b.z -= dz * c * wj;
      }
      for (let i = 0; i < n; i++) if (this.free[i]) this.contact[i] = collide(this.p[i], re);
    }
    // plastic flow: soft material keeps the shape it gets bent into
    if (plast > 0) for (const pr of this.pairs) {
      if (pr.k === 1 || !this.free[pr.i] || !this.free[pr.j]) continue;
      const d = this.p[pr.i].distanceTo(this.p[pr.j]);
      pr.rest = Math.min(pr.k * this.seg, pr.rest + (d - pr.rest) * plast);
    }
    const fr = P.friction * 0.2;
    for (let i = 0; i < n; i++) if (this.free[i] && this.contact[i]) {
      const p = this.p[i], q = this.q[i];
      q.x = p.x - (p.x - q.x) * (1 - fr); q.z = p.z - (p.z - q.z) * (1 - fr);
    }
  }
  render() {
    for (let i = 0; i < this.N; i++) this.pts[i].copy(this.p[i]);
    this.mesh.update(this.pts, this.r, !this.attached || P.soft > 0);
  }
  dispose() { scene.remove(this.mesh.mesh); this.mesh.mesh.geometry.dispose(); }
}

// particles of different pieces (and far-apart parts of the same piece) push each other apart
function interCollide() {
  const list = [];
  for (const rod of rods) for (let i = 0; i < rod.N; i++) if (rod.free[i]) list.push(rod, i);
  const sq = 1 - 0.45 * P.soft;
  for (let a = 0; a < list.length; a += 2) {
    const ra = list[a], ia = list[a + 1], pa = ra.p[ia];
    for (let b = a + 2; b < list.length; b += 2) {
      const rb = list[b], ib = list[b + 1];
      if (ra === rb && Math.abs(ia - ib) < ra.selfSkip) continue;
      const pb = rb.p[ib], min = (ra.r + rb.r) * sq;
      const dx = pb.x - pa.x, dy = pb.y - pa.y, dz = pb.z - pa.z, d2 = dx * dx + dy * dy + dz * dz;
      if (d2 >= min * min || d2 < 1e-10) continue;
      const d = Math.sqrt(d2), c = (min - d) / d * 0.5;
      pa.x -= dx * c; pa.y -= dy * c; pa.z -= dz * c;
      pb.x += dx * c; pb.y += dy * c; pb.z += dz * c;
    }
  }
}

let spawnTimer = 0.3;
function attachedRod() { return rods.find(r => r.attached); }
function spawn() {
  if (attachedRod()) return;
  rods.push(new Rod());
  const free = rods.filter(r => !r.attached);
  while (free.length > P.maxPieces) { const old = free.shift(); old.dispose(); rods.splice(rods.indexOf(old), 1); }
}

function simStep(dt) {
  const s = P.soft;
  const bs = Math.pow(1 - s, 4) * (0.3 + 0.7 * Math.pow(1 - s, 12));
  const plast = Math.pow(s, 1.5) * 0.02;
  leverStep(dt);
  for (const rod of rods) rod.step(dt, bs, plast);
  interCollide();
  for (let i = rods.length - 1; i >= 0; i--) {
    const r = rods[i];
    if (!r.attached && r.p.every(p => p.y < -5)) { r.dispose(); rods.splice(i, 1); }
  }
  if (spawnTimer > 0) { spawnTimer -= dt; if (spawnTimer <= 0 && P.auto) spawn(); }
}

// ---------- camera ----------
const controls = { obj: null };
function camHome() {
  const a = innerWidth / innerHeight, k = a < 0.8 ? 1.55 : 1;
  camera.position.set(3.6 * k, 7.6 + (k - 1) * 3, 13.5 * k);
  if (controls.obj) { controls.obj.target.set(0, 3.2, 0.3); controls.obj.update(); }
}

// ---------- dragging pieces ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(), hit = new V();
function setRay(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
renderer.domElement.addEventListener('pointerdown', e => {
  setRay(e);
  let best = null, bestT = Infinity;
  for (const rod of rods) {
    if (rod.attached) continue;
    for (let i = 0; i < rod.N; i++) {
      const p = rod.p[i];
      if (ray.ray.distanceSqToPoint(p) < (rod.r * 1.8) ** 2) {
        const t = _v.subVectors(p, ray.ray.origin).dot(ray.ray.direction);
        if (t < bestT) { bestT = t; best = { rod, i }; }
      }
    }
  }
  if (!best) return;
  controls.obj.enabled = false;
  plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(_a).negate(), best.rod.p[best.i]);
  drag = { ...best, target: best.rod.p[best.i].clone() };
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!drag) return;
  setRay(e);
  if (ray.ray.intersectPlane(plane, hit)) { drag.target.copy(hit); drag.target.y = Math.max(drag.target.y, 0.1); }
});
const endDrag = () => { if (drag) { drag = null; controls.obj.enabled = true; } };
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

controls.obj = new OrbitControls(camera, renderer.domElement);
controls.obj.enableDamping = true;
controls.obj.minDistance = 4; controls.obj.maxDistance = 30;
camHome();

// keep the machine centred in the space the panel leaves free
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const panel = document.getElementById('panel');
  if (w > 640) { const pw = panel.offsetWidth + 16; camera.setViewOffset(w + pw, h, pw, 0, w, h); }
  else { const ph = Math.min(panel.offsetHeight, h * 0.4) * 0.8; camera.setViewOffset(w, h + ph, 0, ph, w, h); }
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- UI ----------
const $ = id => document.getElementById(id);
const label = $('softLabel');
function setSoft(v) {
  P.soft = v / 100;
  $('soft').value = v; $('v-soft').textContent = v + '%';
  label.textContent = v + '% blød';
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', +c.dataset.v === v));
}
for (const v of [0, 25, 50, 75, 100]) {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.v = v; b.textContent = v + '%';
  b.onclick = () => setSoft(v);
  $('chips').appendChild(b);
}
$('soft').addEventListener('input', e => setSoft(+e.target.value));

const GROUPS = [
  ['Stang', [
    { key: 'length', label: 'Længde', min: 0.8, max: 4, step: 0.1, fmt: v => v.toFixed(1) },
    { key: 'radius', label: 'Tykkelse', min: 0.08, max: 0.34, step: 0.01, fmt: v => v.toFixed(2) },
    { key: 'speed', label: 'Fart ind i røret', min: 0.5, max: 10, step: 0.1, fmt: v => v.toFixed(1) },
    { key: 'metal', label: 'Materiale', options: METALS, on: applyMetal }
  ]],
  ['Fysik', [
    { key: 'gravity', label: 'Tyngdekraft', min: 1, max: 30, step: 0.1, fmt: v => v.toFixed(1) + ' m/s²' },
    { key: 'friction', label: 'Gnidning', min: 0, max: 1, step: 0.01, fmt: v => Math.round(v * 100) + '%' },
    { key: 'slowmo', label: 'Tid', min: 0.05, max: 1.5, step: 0.05, fmt: v => v.toFixed(2) + '×' }
  ]],
  ['Bord og rør', [
    { key: 'holeX', label: 'Hul, side', min: -2.2, max: 2.2, step: 0.05, fmt: v => v.toFixed(2), on: buildTop },
    { key: 'holeZ', label: 'Hul, frem', min: -2.2, max: 2.2, step: 0.05, fmt: v => v.toFixed(2), on: buildTop },
    { key: 'holeR', label: 'Hulstørrelse', min: 0.15, max: 1.2, step: 0.01, fmt: v => v.toFixed(2), on: buildTop },
    { key: 'glass', label: 'Gennemsigtigt rør', min: 0, max: 1, step: 0.01, fmt: v => Math.round(v * 100) + '%', on: applyGlass },
    { key: 'maxPieces', label: 'Max stykker på bordet', min: 1, max: 15, step: 1, fmt: v => v }
  ]],
  ['Maskine', [
    { key: 'auto', label: 'Kør automatisk', toggle: true },
    { key: 'cutter', label: 'Kniv skærer stangen', toggle: true }
  ]]
];
const more = $('more');
for (const [title, ctls] of GROUPS) {
  const g = document.createElement('div'); g.className = 'group';
  g.innerHTML = `<h3>${title}</h3>`;
  for (const c of ctls) {
    const d = document.createElement('div'); d.className = 'ctl';
    if (c.toggle) {
      d.innerHTML = `<label class="toggle"><input type="checkbox" id="c-${c.key}" ${P[c.key] ? 'checked' : ''}>${c.label}</label>`;
      d.querySelector('input').onchange = e => { P[c.key] = e.target.checked; if (c.key === 'auto' && P.auto && !attachedRod()) spawnTimer = 0.2; };
    } else if (c.options) {
      d.innerHTML = `<div class="row"><label for="c-${c.key}">${c.label}</label></div><select id="c-${c.key}">${Object.entries(c.options).map(([k, o]) => `<option value="${k}" ${k === P[c.key] ? 'selected' : ''}>${o.label}</option>`).join('')}</select>`;
      d.querySelector('select').onchange = e => { P[c.key] = e.target.value; c.on && c.on(); };
    } else {
      d.innerHTML = `<div class="row"><label for="c-${c.key}">${c.label}</label><span class="val">${c.fmt(P[c.key])}</span></div><input type="range" id="c-${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${P[c.key]}">`;
      const val = d.querySelector('.val');
      d.querySelector('input').oninput = e => { P[c.key] = +e.target.value; val.textContent = c.fmt(P[c.key]); c.on && c.on(); };
    }
    g.appendChild(d);
  }
  more.appendChild(g);
}
const g2 = document.createElement('div'); g2.className = 'group';
g2.innerHTML = `<div class="btns"><button class="btn" id="camBtn">Nulstil kamera</button></div>
<p class="hint">Træk i et stykke for at kaste rundt med det. Træk i baggrunden for at dreje kameraet, knib eller scroll for at zoome. Mellemrum slipper en ny stang.</p>`;
more.appendChild(g2);
$('camBtn').onclick = camHome;
$('dropBtn').onclick = () => { spawn(); };
$('clearBtn').onclick = () => {
  for (let i = rods.length - 1; i >= 0; i--) if (!rods[i].attached) { rods[i].dispose(); rods.splice(i, 1); }
};
$('moreBtn').onclick = () => { const o = $('panel').classList.toggle('open'); $('moreBtn').textContent = o ? 'Mindre' : 'Mere'; resize(); };
addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); spawn(); } });
setSoft(50);

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  acc += dt * P.slowmo;
  let steps = 0;
  while (acc >= DT && steps < 12) { simStep(DT); acc -= DT; steps++; }
  if (steps === 12) acc = 0;
  poseLever();
  for (const r of rods) r.render();
  controls.obj.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
